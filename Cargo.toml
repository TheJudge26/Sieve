[package]
name = "sieve"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"
chrono = "0.4"

[[bin]]
name = "sieve"
path = "src/main.rs"

[[bin]]
name = "backend"
path = "src/bin/backend.rs"
